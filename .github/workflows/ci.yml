name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:run
      - name: Date suite timezone matrix (incl. DST zones; TZ env only works on Linux)
        run: |
          for tz in UTC America/New_York Pacific/Auckland Asia/Karachi; do
            echo "--- TZ=$tz"
            TZ=$tz npx vitest run src/lib/dates.test.ts src/lib/streak.test.ts src/stores/migrations.test.ts
          done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      # The static export is the shipped artifact (web AND native) — smoke it under
      # both hosting models, including Capacitor-style root-index fallback routing
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - run: npm run test:e2e:static
